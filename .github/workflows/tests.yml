name: Tests

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3]

    name: PHP ${{ matrix.php }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: laso
          MYSQL_USER: laso
          MYSQL_PASSWORD: laso
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_ROOT_HOST: localhost
        ports:
          - "127.0.0.1:3306:3306"
        options: >-
          --health-cmd="mysql --protocol=TCP -h 127.0.0.1 -u laso -plaso -D laso -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.ci .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate

      - name: Run npm install
        run: npm install

      - name: Run npm build
        run: npm run build

      - name: Execute tests
        run: php artisan test -c phpunit.ci.xml
